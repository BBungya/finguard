services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finguard_local}
      POSTGRES_DB: finguard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard -d finguard"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
