name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finguard
          POSTGRES_PASSWORD: finguard_ci
          POSTGRES_DB: finguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finguard -d finguard"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://finguard:finguard_ci@127.0.0.1:5432/finguard
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group api
      - run: uv run --locked --group api ruff check .
      - run: uv run --locked --group api pytest -q -W error
