[project]
name = "finguard"
version = "0.1.0"
description = "Card transaction fraud detection and investigation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
ml = [
    "matplotlib>=3.9,<4",
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "scipy>=1.12,<2",
    "seaborn>=0.13,<1",
    "threadpoolctl>=3,<4",
    "xgboost>=3,<4",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
